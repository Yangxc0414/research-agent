name: Refresh literature digest

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-digest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch public metadata
        run: node scripts/refresh-digest.mjs

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/digest.json
          if git diff --cached --quiet; then
            echo "No digest changes"
            exit 0
          fi
          git commit -m "chore(site): refresh public literature digest"
          git push
