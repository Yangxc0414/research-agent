name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check delivery surface
        run: |
          if [ -f scripts/release_check.py ]; then
            python scripts/release_check.py
          else
            echo "scripts/release_check.py not present (frontend-only public repo); release-surface check not applicable."
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local test dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt not present (frontend-only public repo); skipping backend dependency install."
          fi
      - name: Run core offline suite (hard gate)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d tests ]; then
            # The full suite needs local-only research data (research_agent/web/data,
            # astradraw vendor) that this repository intentionally does not ship; that
            # history is a separate advisory job. This list only pins modules whose
            # inputs ship with the repository — and each pin only runs when its file
            # is actually tracked here (the demo repository intentionally tracks a
            # subset; missing pins are reported, never silently assumed green).
            pinned="test_evolution_generations test_rsi_harness2 test_plugin_bundle test_evolution_policy test_release_surface test_release_integrity test_workspace"
            mods=""
            missing=""
            for m in $pinned; do
              if [ -f "tests/$m.py" ]; then
                mods="$mods tests.$m"
              else
                missing="$missing $m"
              fi
            done
            if [ -n "$mods" ]; then
              python -m unittest $mods -v
            else
              echo "none of the pinned test modules are tracked here; python suite not applicable."
            fi
            if [ -n "$missing" ]; then
              echo "pinned modules not tracked in this repository (skipped, not run):$missing"
            fi
          else
            echo "tests/ not present (frontend-only public repo); python suite not applicable. Web suite runs in the web job."
          fi

  python-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local test dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt not present; skipping."
          fi
      - name: Full offline suite (advisory; needs local-only research data)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "tests/ not present (frontend-only public repo)."
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
