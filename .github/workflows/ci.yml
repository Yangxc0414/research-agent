name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check delivery surface
        run: |
          if [ -f scripts/release_check.py ]; then
            python scripts/release_check.py
          else
            echo "scripts/release_check.py not present (frontend-only public repo); release-surface check not applicable."
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local test dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt not present (frontend-only public repo); skipping backend dependency install."
          fi
      - name: Run offline test suite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "tests/ not present (frontend-only public repo); python suite not applicable. Web suite runs in the web job."
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
