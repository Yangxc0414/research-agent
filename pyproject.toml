[project]
name = "research-agent"
version = "0.1.0"
description = "Evidence-auditable research runtime: gates, claims, closure and governed self-improvement"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"

[tool.ruff]
target-version = "py38"
line-length = 100
exclude = [
  "research_agent/vendor",
  "cortex-agent",
  "oss",
  "claude-code-main",
  "pages-repo",
  "site",
  "demo",
  "apps/web/node_modules",
]

[tool.ruff.lint]
# Keep the default gate at bug-level checks. Legacy style churn is not a
# refactor; new code should be clean without forcing a repository-wide rewrite.
select = ["F", "E9"]
